<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joshua & Serena's Adventure Board</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">

    <nav>

        <h1>🗺️ Adventure Board</h1>

        <div class="nav-links">

            <a href="#">Home</a>
            <a href="#">Map</a>
            <a href="#">Journal</a>
            <a href="#">Completed</a>

        </div>

    </nav>

    <div class="hero-content">

        <h2>Joshua & Serena's Adventures</h2>

        <p>
            Every road trip. Every date. Every hidden gem.
            One place to remember it all.
        </p>

    </div>

</header>

<main>

<section class="dashboard">

<div class="stat">
<h3 id="totalTrips">0</h3>
<p>Destinations</p>
</div>

<div class="stat">
<h3 id="visitedTrips">0</h3>
<p>Visited</p>
</div>

<div class="stat">
<h3 id="favorites">0</h3>
<p>Favorites</p>
</div>

<div class="stat">
<h3 id="bucketList">0</h3>
<p>Bucket List</p>
</div>

</section>

<section class="search-area">

<input
type="text"
id="searchBox"
placeholder="Search adventures...">

</section>

<section class="filters">

<button>All</button>
<button>Date Night</button>
<button>Weekend</button>
<button>Hiking</button>
<button>Cabins</button>
<button>Food</button>
<button>Seasonal</button>

</section>

<section>

<h2 class="section-title">
Our Adventures
</h2>

<div id="cardContainer" class="card-grid">

<!-- Adventure cards appear here -->

</div>

</section>

</main>

<footer>

<p>
Made with ❤️ for Joshua & Serena
</p>

</footer>

<script src="script.js"></script>

</body>
</html>
